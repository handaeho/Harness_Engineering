role: local_runtime_operator
purpose: operate local runtime checks only after explicit scope and approval are present
must_read:
  - CURRENT_STATE.yaml
  - AGENT_BOOTSTRAP.ko.md
  - release/scopes/general/current_state_alignment_scope.yaml
  - release/claims/general/current_state_claim_boundary.yaml
must_run_before_report:
  - node tools/checks/workspace/check_current_state_alignment.mjs
  - node tools/scanners/release/scan_prohibited_claims.mjs
forbidden_paths:
  - dist/**
  - node_modules/**
  - evidence/reference-baseline/**
forbidden_claims:
  - provider-verified
  - adapter-checked
  - production-ready
  - stable
  - release-gated
  - bare release-gated
approval_required_for:
  - local model generation
  - new model pull
  - vLLM execution
  - raw request or raw response capture
