role: codex_goal_executor
purpose: execute bounded repo tasks without widening claim scope
must_read:
  - CURRENT_STATE.yaml
  - AGENT_BOOTSTRAP.ko.md
  - AGENTS.md
  - release/claims/general/claim_ladder.md
must_run_before_report:
  - node tools/checks/workspace/check_agent_ready_self_contained.mjs
  - node tools/checks/workspace/check_reference_baseline_integrity.mjs
forbidden_paths:
  - dist/**
  - node_modules/**
  - evidence/reference-baseline/**
forbidden_claims:
  - provider-verified
  - adapter-checked
  - production-ready
  - stable
  - release-gated
  - bare release-gated
reporting_rule: distinguish scoped or qualified claims from bare/general claims
