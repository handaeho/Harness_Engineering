id: harness-core
version: v2.0.0
status: v2.0.0-rc.1-postrc-final-dossier

project:
  name: HARNESS Core
  slug: harness-core
  legacy_names: []
  description: Evidence-gated autonomous agent engineering harness.

agent_entrypoint:
  path: AGENTS.md
  role: agent_facing_system_of_record_index

legacy_source_of_truth:
  - stack.yaml
  - stack.schema.json
  - core/spec/harness.spec.yaml

source_of_truth:
  agent_index:
    - CURRENT_STATE.yaml
    - START_HERE_FOR_AGENTS.ko.md
    - AGENT_BOOTSTRAP.ko.md
    - AGENTS.md
  machine_manifest:
    - stack.yaml
    - stack.schema.json
  core_contract:
    - core/spec/harness.spec.yaml
  release_contract:
    - release/claims/general/claim_ladder.md
    - release/gates/core-release/release_gate.yaml
  capability_contract:
    - adapters/provider_capability_matrix.yaml
  evidence_truth:
    - evidence/

asset_class_manifest:
  path: MANIFEST.asset_classes.yaml

reference_baseline:
  status: available
  role: historical_reference_snapshot
  active_source_of_truth: false
  path: evidence/reference-baseline
  mutation_policy: read_only
dist_policy:
  path: dist
  generated_only: true
  editable_by_human: false
core:
  harness_spec: core/spec/harness.spec.yaml
  policies:
    - core/spec/behavior_policy.md
    - core/spec/context_policy.md
    - core/spec/tool_policy.md
    - core/spec/output_contract.schema.json
    - core/spec/claim_strength_policy.md
    - core/spec/failure_modes.md
adapters:
  capability_matrix: adapters/provider_capability_matrix.yaml
  skeletons:
    - adapters/api/openai/adapter.yaml
    - adapters/api/gemini/adapter.yaml
    - adapters/local/vllm/adapter.yaml
    - adapters/local/ollama/adapter.yaml
validation:
  static_suite: evals/suites/static_structure.yaml
observability:
  trace_schema: observability/trace.schema.json
  telemetry_schema: observability/telemetry.schema.json
release:
  gate: release/gates/core-release/release_gate.yaml
  claim_ladder: release/claims/general/claim_ladder.md
  rollback_plan: release/plans/core-release/rollback_plan.md
allowed_claims:
  - provider-diverse
  - local-model-verified
  - post-export-active-provider-lanes-verified
  - post-export-active-adapters-checked
  - post-export-active-scoped-production-ready
  - post-export-active-scoped-stable
  - post-rc-openai-only-stable
  - post-rc-openai-only-production-ready
  - production-monitored
  - telemetry-connected
  - containment-verified
  - rc1-openai-scope-release-gated
notes:
  - Current state is indexed in CURRENT_STATE.yaml.
  - Agent-ready clean export is exports/harness-core-agent-ready.zip.
  - Latest dossier evidence export is exports/v2.0.0-rc.1-postrc-final-dossier-export.zip.
  - harness-core is the canonical directory and slug.
  - New product projects vendor HARNESS Core at <new-project-root>/.harness/harness-core/ and can copy templates/external-project/.
  - Structured user project input uses docs/guides/PROJECT_INPUT_TEMPLATE.ko.md as the reference template and is captured per project in PROJECT_INPUT.md.
  - Bare/general provider-verified, adapter-checked, production-ready, stable, and release-gated claims remain blocked.
  - Historical reference records/reports were inspected, but legacy reference runners were not re-executed in this step.
