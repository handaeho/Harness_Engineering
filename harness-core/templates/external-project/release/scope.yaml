scope_id: project-bootstrap-scope
status: draft

allowed_paths:
  - README.md
  - src/**
  - app/**
  - pages/**
  - lib/**
  - cmd/**
  - internal/**
  - tests/**
  - __tests__/**
  - docs/**
  - .harness/project/**
  - package.json
  - pyproject.toml
  - Cargo.toml
  - go.mod

forbidden_paths:
  - node_modules/**
  - dist/**
  - .harness/harness-core/evidence/reference-baseline/**
  - .harness/harness-core/dist/**
  - .harness/harness-core/node_modules/**

notes:
  - Product code should follow the framework standard layout.
  - HARNESS Core is a vendored reference at .harness/harness-core.
  - Project-specific harness state, evidence, release files, and checkers belong in .harness/project/.
