  - same case id set
  - same tool schema set
  - built-in tools absent
  - remote MCP absent
  - local model execution false
  - external side effects false
  - blocked tools executed equals zero
  - raw response stored false
  - redaction passed
  - required trace events present in both attempts

claim_boundary:
