id: harness-core.static_structure
version: 2.0.0-alpha
status: static-suite-defined

required_files:
  - README.md
  - stack.yaml
  - stack.schema.json
  - core/spec/harness.spec.yaml
  - core/spec/behavior_policy.md
  - core/spec/context_policy.md
  - core/spec/tool_policy.md
  - core/spec/output_contract.schema.json
  - core/spec/claim_strength_policy.md
  - core/spec/failure_modes.md
  - core/capabilities/README.md
  - adapters/provider_capability_matrix.yaml
  - adapters/api/openai/adapter.yaml
  - adapters/local/vllm/adapter.yaml
  - adapters/local/ollama/adapter.yaml
  - adapters/common/README.md
  - runtime/README.md
  - evals/README.md
  - evals/suites/static_structure.yaml
  - observability/trace.schema.json
  - observability/telemetry.schema.json
  - security/threat_model.md
  - release/release_gate.yaml
  - release/claim_ladder.md
  - release/rollback_plan.md
  - evidence/v36-baseline/file_inventory.json
  - evidence/v36-baseline/checksums.json
  - evidence/v36-baseline/limitation_register.json
  - evidence/v36-baseline/migration_map.yaml
  - dist/README.md

parse_checks:
  yaml:
    - stack.yaml
    - core/spec/harness.spec.yaml
    - adapters/provider_capability_matrix.yaml
    - adapters/api/openai/adapter.yaml
    - adapters/local/vllm/adapter.yaml
    - adapters/local/ollama/adapter.yaml
    - release/release_gate.yaml
    - evidence/v36-baseline/migration_map.yaml
  json_schema:
    - stack.schema.json
    - core/spec/output_contract.schema.json
    - observability/trace.schema.json
    - observability/telemetry.schema.json
  json:
    - evidence/v36-baseline/file_inventory.json
    - evidence/v36-baseline/checksums.json
    - evidence/v36-baseline/limitation_register.json

dist_policy:
  allowed_files:
    - dist/README.md
  generated_artifacts_only: true

claim_policy:
  allowed_alpha_claims:
    - harness-designed
    - static-structure-created
    - baseline-snapshotted
    - adapter-skeleton-created
  prohibited_positive_claims:
    - production-ready
    - production-monitored
    - containment-verified
    - replay-verified
    - benchmark-backed
    - provider-diverse
    - integration-verified
    - release-gated
  checklist_note: These labels may appear only inside policy/checklist fields, not as achieved status.

required_notes:
  - Existing records/reports were inspected, but v36 runners were not re-executed in this step.
