id: harness-core.adapter_conformance_design
version: 2.0.0-alpha-hardening
status: design-and-dry-run

purpose: Define adapter conformance cases without executing providers or local models.

fixtures:
  - evals/fixtures/adapters/openai_message_mapping_cases.jsonl
  - evals/fixtures/adapters/vllm_message_mapping_cases.jsonl
  - evals/fixtures/adapters/ollama_message_mapping_cases.jsonl
  - evals/fixtures/adapters/structured_output_cases.jsonl
  - evals/fixtures/adapters/tool_call_cases.jsonl
  - evals/fixtures/adapters/unsupported_feature_cases.jsonl

non_goals:
  - provider API execution
  - local model execution
  - runtime orchestration
  - actual tool calling
  - replay verification
  - live telemetry

claim_policy:
  fixture_exists_is_not_test_passed: true
  adapter_skeleton_exists_is_not_adapter_checked: true
  adapter_checked_requires_conformance_runner_execution: true
  dry_run_mapping_pass_is_not_provider_execution_pass: true

dry_run_runner:
  path: tools/run_adapter_conformance_dry_run.mjs
  mode: dry_run_no_provider_execution
  allowed_claim_after_pass: adapter-dry-run-checked
  still_blocked:
    - adapter-checked
    - integration-verified
    - provider-diverse
    - replay-verified
    - production-monitored
    - release-gated
