stage: v2.0.0-post-final-dossier-agent-ready-export-repair
scope: final_dossier_agent_ready_export_repair
purpose: rebuild the final dossier export so a new agent can use one zip to read the current state and application layer
package_path: exports/v2.0.0-rc.1-postrc-final-dossier-agent-ready-export.zip
allowed_actions:
  - create agent-ready export zip
  - include current-state and agent application layer files in the export
  - verify export package entries
  - write export repair evidence and reports
forbidden_actions:
  - OpenAI model API call
  - OpenAI provider rerun
  - local model generation
  - telemetry sink write
  - redteam rerun
  - adapter conformance rerun
  - npm install
  - npm ci
  - legacy-reference-source modification
  - dist modification
  - evidence/reference-baseline refresh
  - raw request storage
  - raw response storage
  - secret/API key/auth header storage
  - provider-verified claim remains forbidden
  - adapter-checked claim remains forbidden
  - production-ready claim remains forbidden
  - stable claim remains forbidden
  - release-gated claim remains forbidden
protected_paths:
  - legacy-reference-source/**
  - dist/**
  - node_modules/**
  - evidence/reference-baseline/**
required_export_entries:
  - CURRENT_STATE.yaml
  - AGENT_BOOTSTRAP.ko.md
  - AGENTS.md
  - README.md
  - stack.yaml
  - docs/handoffs/session_handoff_latest.md
  - docs/workspace/how_to_apply_harness_to_agents.ko.md
  - profiles/agents/codex_goal_executor.yaml
  - profiles/agents/chatgpt_reviewer.yaml
  - profiles/agents/local_runtime_operator.yaml
  - profiles/agents/release_gate_reviewer.yaml
  - evidence/current-state/current_state_index.json
  - evidence/current-state/current_state_gate_report.json
  - evidence/current-state/current_state_claim_boundary.json
  - tools/checks/workspace/check_current_state_alignment.mjs
  - tools/builders/workspace/build_current_state_index.mjs
excluded_export_entries:
  - node_modules/**
  - dist/**
  - .git/**
  - .DS_Store
  - raw request payload
  - raw response payload
  - secret/API key/auth header values
