stage: v2.0.0-beta-release-gate-thresholds-and-dry-run
mode: dry_run_only

inputs:
  - evidence/beta-release-evidence-bundle
  - evidence/beta-openai-canary-replay-suite
  - evidence/beta-canary-matrix-summary

execution_policy:
  new_provider_execution: false
  local_model_execution: false
  local_endpoint_probe: false
  dist_modification: false
  reference_baseline_modification: false

result_policy:
  expected_status: blocked_not_release_gated
  release_gate_passed: false
  production_ready: false
  production_monitored: false
  provider_diversity_established: false
  local_model_execution_verified: false

claim_policy:
  dry_run_claims_only: true
  release_gated_claim_allowed: false
  production_ready_claim_allowed: false
  provider_diversity_claim_allowed: false
  replay_verified_claim_allowed: false
