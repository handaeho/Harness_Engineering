stage: v2.0.0-beta-tool-calling-canary-openai

approved_execution:
  openai_provider_api_call: true
  responses_api_function_tools: true
  deterministic_mock_tools_only: true
  tool_argument_ajv_validation: true
  approval_gate_check: true
  function_call_output_reinjection: true
  final_response_capture: true
  store_false: true
  provider_trace_capture: true
  request_response_redaction: true

forbidden_execution:
  built_in_tools: true
  web_search_tool: true
  file_search_tool: true
  code_interpreter: true
  computer_use: true
  remote_mcp: true
  external_network_calls_from_tools: true
  real_file_writes: true
  shell_command_execution: true
  local_model_execution: true
  live_telemetry: true
  redteam_execution: true
  replay_verification: true
  release_gate_claim: true

claims_allowed:
  - openai-tool-calling-canary-executed
  - provider-tool-call-path-checked
  - tool-argument-schema-canary-validated
  - mock-tool-output-reinjection-checked
  - tool-approval-boundary-canary-checked
  - tool-output-reclassification-checked
  - tool-calling-trace-captured
  - tool-calling-redaction-checked

claims_not_allowed:
  - tool-call-verified
  - adapter-checked
  - provider-verified
  - runtime-verified
  - schema-output-verified
  - telemetry-connected
  - production-ready
  - production-monitored
  - containment-verified
  - replay-verified
  - benchmark-backed
  - provider-diverse
  - integration-verified
  - release-gated
