id: v2.0.0-harness-core-final-precommit-convergence-autopilot
status: final_precommit_convergence_scope_recorded
scope:
  summary: Finalize HARNESS Core root workspace, reference baseline, clean export, and git readiness surfaces before owner commit approval.
  operating_modes:
    primary: root_workspace
    secondary: agent_ready_export
  allowed_changes:
    - HARNESS Core root/export command documentation
    - current-state alignment metadata
    - final precommit convergence checker and evidence
    - neutral archiving of legacy reference evidence directories
    - clean export regeneration
    - git staging readiness
  forbidden_changes:
    - OpenAI API call
    - OpenAI provider rerun
    - paid provider execution
    - local model generation
    - telemetry sink write
    - redteam rerun
    - adapter conformance rerun
    - npm install
    - npm ci
    - new model pull or download
    - vLLM execution
    - dist edit
    - reference baseline refresh
    - reference checksum recalculation
    - legacy reference source edit
    - raw request storage
    - raw response storage
    - secret/API key/auth header storage
    - production deployment
    - release gate rerun
    - git commit
command_policy:
  root_workspace_mode:
    first_command: node tools/check_agent_ready_self_contained.mjs
    additional_checks:
      - node tools/check_current_state_alignment.mjs
      - node tools/check_reference_baseline_integrity.mjs
      - node tools/scan_prohibited_claims.mjs
      - node tools/validate_alpha.mjs
      - node tools/check_harness_core_final_precommit_convergence.mjs
  agent_ready_export_mode:
    first_commands:
      - node tools/check_agent_ready_self_contained.mjs
      - node tools/check_reference_baseline_integrity.mjs
    current_state_alignment_default_command: false
    final_precommit_convergence_default_command: false
reference_baseline:
  active_path: evidence/reference-baseline
  mutation_policy: read_only
  refresh_performed: false
  source_scan_performed: false
  checksum_recalculated: false
commit:
  commit_ready_target: true
  commit_performed: false
  commit_approval_required: true
  required_approval_phrase: I approve committing the HARNESS Core rename and final surface cleanup.
