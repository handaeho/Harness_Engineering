otel_genai_mapping:
  source_reference: https://opentelemetry.io/docs/specs/semconv/gen-ai/
  internal_to_otel:
    provider:
      maps_to: gen_ai.system
      notes: provider or model ecosystem identifier
    model:
      maps_to: gen_ai.request.model
      notes: model id from env or adapter config
    input_tokens:
      maps_to: gen_ai.usage.input_tokens
    output_tokens:
      maps_to: gen_ai.usage.output_tokens
    latency_ms:
      maps_to: span.duration
    tool_name:
      maps_to: gen_ai.tool.name
    operation_name:
      maps_to: gen_ai.operation.name
    response_model:
      maps_to: gen_ai.response.model
    request_max_tokens:
      maps_to: gen_ai.request.max_tokens
    finish_reason:
      maps_to: gen_ai.response.finish_reasons
  stability:
    status: design_only
    live_emission_enabled: false
    semconv_status_note: GenAI conventions are treated as mapping input only until exporter connection is approved.
