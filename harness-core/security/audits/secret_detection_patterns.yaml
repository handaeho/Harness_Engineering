secret_detection_patterns:
  openai_api_key_like:
    pattern: "sk-[A-Za-z0-9_-]{20,}"
    severity: critical

  bearer_token_like:
    pattern: "Bearer\\s+[A-Za-z0-9._~+/=-]{20,}"
    severity: critical

  langfuse_secret_key_like:
    pattern: "(?i)langfuse.*secret.*[A-Za-z0-9_-]{16,}"
    severity: high

  otel_header_secret_like:
    pattern: "(?i)OTEL_EXPORTER_OTLP_HEADERS.*(Bearer|Basic|apikey|token)"
    severity: high

  env_assignment_with_secret_value:
    pattern: "(?i)(OPENAI_API_KEY|LANGFUSE_SECRET_KEY|OTEL_EXPORTER_OTLP_HEADERS)\\s*=\\s*['\\\"]?[^'\\\"\\s]{8,}"
    severity: high

allowed_contexts:
  - required_env list
  - environment requirement index
  - credential policy docs
  - approval request docs
  - command plan placeholders
  - scanner regex definitions
