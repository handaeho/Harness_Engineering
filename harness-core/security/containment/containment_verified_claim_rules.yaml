containment_verified_claim_rules:
  status: conditional
  containment_verified:
    allowed_only_if:
      - evidence_sufficiency_audit_passed == true
      - owner_final_decision == approve_containment_verified
      - release_gated_allowed == false
      - production_ready_allowed == false
    does_not_allow:
      - release-gated
      - production-ready
      - production-monitored
  forbidden_claims:
    - stable
    - release-gated
    - production-ready
    - production-monitored
    - telemetry-connected
    - redteam-passed
    - provider-diverse
    - provider-verified
    - adapter-checked
    - local-model-verified
    - runtime-verified
    - tool-call-verified
    - schema-output-verified
    - replay-verified
    - integration-verified
    - benchmark-backed
