id: beta_containment_boundary_mock_dry_run
stage: v2.0.0-beta-containment-boundary-mock-dry-run
execution_mode: mock_containment_dry_run

runner:
  command: node prompt-stack-v2/tools/run_containment_boundary_mock_dry_run.mjs
  check: node prompt-stack-v2/tools/check_containment_boundary_mock_dry_run.mjs

required_inputs:
  - evals/fixtures/containment/
  - security/containment/containment_result.schema.json
  - security/containment/containment_trace.schema.json
  - security/containment/containment_mock_runtime_policy.yaml
  - security/containment/containment_no_side_effect_policy.yaml

expected_outputs:
  - evidence/beta-containment-boundary-mock-dry-run/containment_boundary_mock_dry_run_report.json
  - evidence/beta-containment-boundary-mock-dry-run/containment_case_results.jsonl
  - evidence/beta-containment-boundary-mock-dry-run/containment_trace_samples.jsonl
  - evidence/beta-containment-boundary-mock-dry-run/containment_boundary_summary.json
  - evidence/beta-containment-boundary-mock-dry-run/containment_no_side_effect_report.json
  - evidence/beta-containment-boundary-mock-dry-run/containment_schema_validation_report.json
  - evidence/beta-containment-boundary-mock-dry-run/containment_mock_gate_report.json

must_remain_false:
  - new_provider_execution
  - new_redteam_execution
  - local_model_execution
  - telemetry_connection
  - external_side_effects
  - containment_verified
  - redteam_passed
  - release_gate_passed
  - production_ready
  - production_monitored

claims_not_allowed:
  - containment-verified
  - redteam-passed
  - release-gated
  - production-ready
  - production-monitored
