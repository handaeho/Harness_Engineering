storage_redaction_audit_policy:
  stage: v2.0.0-beta-cross-suite-storage-redaction-audit
  execution_mode: no_execution_static_artifact_scan
  scan_scope:
    include:
      - evidence/
      - evals/reports/
      - docs/
      - release/
      - security/
      - observability/
      - runtime/
      - adapters/
      - tools/
      - README.md
      - session_handoff_2026-05-22.md
    exclude:
      - node_modules/
      - .git/
      - dist/
      - package-lock.json
      - prompt-stack/v36/
  pass_requires:
    raw_request_storage_violations: 0
    raw_response_storage_violations: 0
    secret_pattern_violations: 0
    auth_header_violations: 0
    needs_review_findings: 0
  claim_rules:
    audit_pass_is_not_containment_verified: true
    audit_pass_is_not_telemetry_connected: true
    audit_pass_is_not_release_gated: true
