id: prompt-stack-v2
version: 2.0.0-alpha
status: alpha-skeleton

agent_entrypoint:
  path: AGENTS.md
  role: human_and_agent_facing_system_of_record_index

legacy_source_of_truth:
  - stack.yaml
  - stack.schema.json
  - core/spec/harness.spec.yaml

source_of_truth:
  agent_index:
    - AGENTS.md
  machine_manifest:
    - stack.yaml
    - stack.schema.json
  core_contract:
    - core/spec/harness.spec.yaml
  release_contract:
    - release/claim_ladder.md
    - release/release_gate.yaml
  capability_contract:
    - adapters/provider_capability_matrix.yaml
  evidence_truth:
    - evidence/

asset_class_manifest:
  path: MANIFEST.asset_classes.yaml

baseline:
  source_package: prompt-stack/v36
  evidence_path: evidence/v36-baseline
  mutation_policy: read_only
dist_policy:
  path: dist
  generated_only: true
  editable_by_human: false
core:
  harness_spec: core/spec/harness.spec.yaml
  policies:
    - core/spec/behavior_policy.md
    - core/spec/context_policy.md
    - core/spec/tool_policy.md
    - core/spec/output_contract.schema.json
    - core/spec/claim_strength_policy.md
    - core/spec/failure_modes.md
adapters:
  capability_matrix: adapters/provider_capability_matrix.yaml
  skeletons:
    - adapters/api/openai/adapter.yaml
    - adapters/local/vllm/adapter.yaml
    - adapters/local/ollama/adapter.yaml
validation:
  static_suite: evals/suites/static_structure.yaml
observability:
  trace_schema: observability/trace.schema.json
  telemetry_schema: observability/telemetry.schema.json
release:
  gate: release/release_gate.yaml
  claim_ladder: release/claim_ladder.md
  rollback_plan: release/rollback_plan.md
allowed_claims:
  - harness-designed
  - static-structure-created
  - baseline-snapshotted
  - adapter-skeleton-created
notes:
  - Existing records/reports were inspected, but v36 runners were not re-executed in this step.
