id: prompt-stack-v2.release_gate
version: 2.0.0-beta-release-evidence-bundle-draft
status: beta-release-evidence-bundle-draft

alpha_required_checks:
  - required files exist
  - stack.yaml conforms to stack.schema.json
  - harness.spec.yaml parses successfully
  - adapter.yaml files parse successfully
  - output_contract.schema.json is valid JSON Schema
  - trace.schema.json is valid JSON Schema
  - telemetry.schema.json is valid JSON Schema
  - dist contains only README.md
  - prohibited positive claims are absent outside policy checklists
  - baseline comparison has no unexplained items
  - adapter conformance fixtures exist
  - dependency-backed validation passes without fallback
  - adapter conformance dry-run passes without provider or local execution
  - beta entry gate report exists
  - beta mock execution scope exists
  - mock runtime execution runner passes without provider or local execution
  - approval gate blocks blocked mock tools before execution
  - trace samples validate against trace schema
  - beta mock gate report exists
  - OpenAI provider canary scope exists
  - OpenAI provider canary runner records pass or explicit blocked status
  - OpenAI provider canary uses no tools and no structured output
  - OpenAI provider canary enforces store false
  - OpenAI provider canary redaction report exists
  - prior blocked OpenAI provider canary attempt is archived
  - credentialed OpenAI provider canary attempt is archived separately
  - credentialed OpenAI provider canary rerun attempt is archived separately
  - OpenAI structured output canary scope exists
  - OpenAI structured output canary runner records pass or explicit blocked status
  - OpenAI structured output canary uses no tools
  - OpenAI structured output canary enforces store false
  - OpenAI structured output canary uses strict text.format json_schema
  - OpenAI structured output canary validates returned JSON with Ajv
  - OpenAI structured output canary redaction report exists
  - OpenAI tool-calling canary scope exists
  - OpenAI tool-calling canary runner records pass or explicit blocked status
  - OpenAI tool-calling canary uses function tools only
  - OpenAI tool-calling canary forbids built-in tools and remote MCP
  - OpenAI tool-calling canary validates tool arguments with Ajv
  - OpenAI tool-calling canary executes deterministic mock tools only
  - OpenAI tool-calling canary reclassifies tool output as untrusted
  - OpenAI tool-calling canary redaction report exists
  - Canary matrix summary exists
  - Local readiness blockers are recorded
  - Local readiness report records no local model execution
  - Claim status report blocks local and provider diversity claims
  - OpenAI tool-calling replay rerun scope exists
  - OpenAI tool-calling rerun attempt is archived separately when executed
  - OpenAI tool-calling replay comparison report exists
  - OpenAI tool-calling replay trace comparison report exists
  - OpenAI tool-calling replay redaction report exists
  - OpenAI canary replay suite scope exists
  - OpenAI no-tool replay rerun attempt is archived separately when executed
  - OpenAI structured output replay rerun attempt is archived separately when executed
  - OpenAI canary replay suite comparison reports exist
  - OpenAI canary replay suite summary exists
  - OpenAI canary replay suite trace comparison exists
  - OpenAI canary replay suite redaction report exists
  - Beta release evidence bundle scope exists
  - Beta release evidence index exists
  - Beta release claim status report exists
  - Beta release claim boundary audit exists
  - Beta release evidence lineage exists
  - Beta release readiness assessment exists
  - Beta release blockers and gaps register exists
  - Beta release bundle manifest and checksums exist
  - Beta release evidence bundle gate report exists

