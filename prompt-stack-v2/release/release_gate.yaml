id: prompt-stack-v2.release_gate
version: 2.0.0-beta-production-telemetry-design
status: beta-production-telemetry-design

alpha_required_checks:
  - required files exist
  - stack.yaml conforms to stack.schema.json
  - harness.spec.yaml parses successfully
  - adapter.yaml files parse successfully
  - output_contract.schema.json is valid JSON Schema
  - trace.schema.json is valid JSON Schema
  - telemetry.schema.json is valid JSON Schema
  - dist contains only README.md
  - prohibited positive claims are absent outside policy checklists
  - baseline comparison has no unexplained items
  - adapter conformance fixtures exist
  - dependency-backed validation passes without fallback
  - adapter conformance dry-run passes without provider or local execution
  - beta entry gate report exists
  - beta mock execution scope exists
  - mock runtime execution runner passes without provider or local execution
  - approval gate blocks blocked mock tools before execution
  - trace samples validate against trace schema
  - beta mock gate report exists
  - OpenAI provider canary scope exists
  - OpenAI provider canary runner records pass or explicit blocked status
  - OpenAI provider canary uses no tools and no structured output
  - OpenAI provider canary enforces store false
  - OpenAI provider canary redaction report exists
  - prior blocked OpenAI provider canary attempt is archived
  - credentialed OpenAI provider canary attempt is archived separately
  - credentialed OpenAI provider canary rerun attempt is archived separately
  - OpenAI structured output canary scope exists
  - OpenAI structured output canary runner records pass or explicit blocked status
  - OpenAI structured output canary uses no tools
  - OpenAI structured output canary enforces store false
  - OpenAI structured output canary uses strict text.format json_schema
